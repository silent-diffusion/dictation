name: Release

# Push a tag like v1.2.0, or use Actions > Release > Run workflow and type the version, and this builds the
# installer and publishes it as a GitHub release (Run workflow also creates the v<version> tag on the chosen branch).
# The app's "Check for updates" button reads these releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION.Trim().TrimStart('v') } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3 (got '$v')" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/Dictation.Tests -c Release

      - name: Publish app (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/Dictation.App/Dictation.App.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o publish
          Copy-Item inference publish/inference -Recurse

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          function Find-Iscc { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not (Find-Iscc)) { choco install innosetup -y --no-progress }
          $iscc = (Find-Iscc).FullName
          Write-Host "Using $iscc"
          & $iscc "/DMyAppVersion=$env:VERSION" "/DSourceDir=..\publish" installer\LocalDictation.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:VERSION" "dist/Oberton-Setup-$env:VERSION.exe" --target "$env:GITHUB_SHA" --title "Oberton $env:VERSION" --generate-notes
